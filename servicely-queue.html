<script type="text/javascript">
    /**
     * Registers a node that connects to a Servicely Instance and claims tasks from a work queue.
     */
    RED.nodes.registerType('servicely-queue', {
        category: 'servicely',
        color: '#a6bbcf',
        defaults: {
            name: {value: ""},
            connection: {value: "", type: "servicely-connection", required: true},
            subject: {value: "", required: true},
            pollingInterval: {value: 5, required: true, validate: function (v) { return RED.validators.number()(v) && Number(v) > 0; }},
            requestCount: {value: 10, validate: function (v) { return v === "" || (RED.validators.number()(v) && Number(v) >= 1); }},
            identifier: {value: "node-red"}
        },
        inputs: 0,
        outputs: 1,
        paletteLabel: 'Queue',
        icon: "servicely-image-nodered.png",
        label: function () {
            return this.name || this.subject || "Queue";
        },
        oneditprepare: function () {
            $("#node-input-pollingInterval").spinner({ min: 1 });
            $("#node-input-requestCount").spinner({ min: 1 });
        }
    });

    /**
     * Registers a node that can respond with a success message to tasks obtained by the 'servicely-queue' node.
     */
    RED.nodes.registerType('servicely-success', {
        category: 'servicely',
        color: '#c0edc0',
        defaults: {
            name: { value: ""}
        },
        inputs: 1,
        outputs: 0,
        paletteLabel: 'Success',
        icon: "servicely-image-nodered.png",
        label: function () {
            return this.name || "Success";
        }
    });

    /**
     * Registers a node that can respond with a failure message to tasks obtained by the 'servicely-queue' node.
     */
    RED.nodes.registerType('servicely-failure', {
        category: 'servicely',
        color: '#e49191',
        defaults: {
            name: {value: ""}
        },
        inputs: 1,
        outputs: 0,
        paletteLabel: 'Failure',
        icon: "servicely-image-nodered.png",
        label: function () {
            return this.name || "Failure";
        }
    });

    /**
     * Registers a node that sends a progress update for tasks obtained by the 'servicely-queue' node.
     */
    RED.nodes.registerType('servicely-progress', {
        category: 'servicely',
        color: '#56de78',
        defaults: {
            progressMessage: { value: "" },
            name: { value: "" }
        },
        inputs: 1,
        outputs: 1,
        paletteLabel: 'Progress',
        icon: "servicely-image-nodered.png",
        label: function () {
            return this.name || this.progressMessage || "Progress";
        }
    });
</script>

<script type="text/html" data-help-name="servicely-queue">
    <p>Claims actions from a Servicely asynchronous queue and sends one message per action.</p>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object | string</span></dt>
        <dd>The action's payload. JSON payloads are parsed into an object.</dd>
        <dt>original_payload_fields <span class="property-type">object</span></dt>
        <dd>A copy of the parsed payload, for use in <b>Change</b> nodes.</dd>
        <dt>_reply_to <span class="property-type">string</span></dt>
        <dd>The action ID. Used by the <b>Success</b>, <b>Failure</b> and <b>Progress</b> nodes to reply.</dd>
        <dt>_connectionNode <span class="property-type">string</span></dt>
        <dd>The connection the action came from.</dd>
        <dt>_original_payload <span class="property-type">object</span></dt>
        <dd>The action as returned by the queue.</dd>
        <dt>parts <span class="property-type">object</span></dt>
        <dd>The action's position in the batch, so a <b>Join</b> node in automatic mode can recombine them.</dd>
    </dl>

    <h3>Details</h3>
    <p>The node polls the queue configured on the connection for actions named <i>Action name</i>. It waits for
        each poll to finish before scheduling the next one. When a full batch is returned it polls again straight
        away, so a backlog is worked through quickly.</p>
    <p>Keep the <code>_reply_to</code> and <code>_connectionNode</code> properties on the message so the reply
        nodes can respond. Polling errors can be handled with a <b>Catch</b> node.</p>
    <p><i>Identifier</i> is sent with each poll, so the instance can tell several Node-RED instances apart.</p>
</script>

<script type="text/html" data-help-name="servicely-success">
    <p>Marks an action claimed by the <b>Queue</b> node as completed successfully.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">any</span></dt>
        <dd>The result returned to Servicely.</dd>
        <dt>_reply_to <span class="property-type">string</span></dt>
        <dd>The action ID, set by the <b>Queue</b> node.</dd>
        <dt>_connectionNode <span class="property-type">string</span></dt>
        <dd>The connection, set by the <b>Queue</b> node.</dd>
    </dl>

    <h3>Details</h3>
    <p>If the reply fails, the error can be handled with a <b>Catch</b> node.</p>
</script>

<script type="text/html" data-help-name="servicely-failure">
    <p>Marks an action claimed by the <b>Queue</b> node as failed.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">any</span></dt>
        <dd>The error details returned to Servicely.</dd>
        <dt class="optional">rc <span class="property-type">object</span></dt>
        <dd>When <code>msg.rc.code</code> is not 0, <code>msg.rc.message</code> is returned instead of the payload
            (as set by e.g. the <b>exec</b> node).</dd>
        <dt>_reply_to <span class="property-type">string</span></dt>
        <dd>The action ID, set by the <b>Queue</b> node.</dd>
        <dt>_connectionNode <span class="property-type">string</span></dt>
        <dd>The connection, set by the <b>Queue</b> node.</dd>
    </dl>

    <h3>Details</h3>
    <p>A common pattern is a <b>Catch</b> node wired to a <b>Failure</b> node, so any error while processing an
        action is reported back to Servicely.</p>
</script>

<script type="text/html" data-help-name="servicely-progress">
    <p>Sends a progress update for an action claimed by the <b>Queue</b> node, and passes the message on.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt class="optional">progress <span class="property-type">string</span></dt>
        <dd>The progress message. Overrides the message configured on the node.</dd>
        <dt>_reply_to <span class="property-type">string</span></dt>
        <dd>The action ID, set by the <b>Queue</b> node.</dd>
        <dt>_connectionNode <span class="property-type">string</span></dt>
        <dd>The connection, set by the <b>Queue</b> node.</dd>
    </dl>

    <h3>Outputs</h3>
    <p>The input message, unchanged.</p>
</script>
