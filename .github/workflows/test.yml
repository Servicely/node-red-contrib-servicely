name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node-RED 4 supports Node.js 18+; Node-RED 5 requires Node.js 22.9+
          - { node: 20, node-red: 4 }
          - { node: 22, node-red: 4 }
          - { node: 22, node-red: 5 }
          - { node: 24, node-red: 5 }
    name: Node ${{ matrix.node }} / Node-RED ${{ matrix.node-red }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save node-red@${{ matrix.node-red }}
      - run: npm run lint
      - run: npm test
      - name: Package contents
        run: npm pack --dry-run
