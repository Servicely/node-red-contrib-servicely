<script type="text/javascript">
    RED.nodes.registerType('servicely-connection', {
        category: 'config',
        defaults: {
            baseUrl: {value: "https://[instance-name].servicely.ai/", required: true},
            queue: {value: "node-red.default.queue", required: true},
            name: {value: null},
            authtype: { value: "" },
            // Legacy plain-text credentials from older versions. Migrated into 'credentials' on edit.
            username: { value: null},
            password: { value: null},
            token: { value: null},
            secret: { value: null}
        },
        credentials: {
            user: { type: "text" },
            pass: { type: "password" },
            apiToken: { type: "password" },
            apiSecret: { type: "password" }
        },
        label: function () {
            return this.name || this.baseUrl;
        },
        oneditprepare: onEditPrepare,
        oneditsave: onEditSave
    });

    /**
     * Registers a node allows a Servicely connection to be injected for subsequent nodes
     */
    RED.nodes.registerType('servicely-connection-injector', {
        category: 'servicely-rest',
        color: '#c0deed',
        defaults: {
            name: {value: null},
            connection: { value: null, type: "servicely-connection", required: true }
        },
        inputs: 1,
        outputs: 1,
        paletteLabel: 'Connector',
        icon: "servicely-image-nodered.png",
        label: function () {
            return this.name || "Connector";
        }
    });

    function onEditPrepare() {
        let credentials = this.credentials || {};

        // Move legacy plain-text values into the credential inputs; they are cleared from the flow on save.
        if (this.username && !credentials.user) {
            $("#node-config-input-user").val(this.username);
        }
        if (this.password && !credentials.has_pass) {
            $("#node-config-input-pass").val(this.password);
        }
        if (this.token && !credentials.has_apiToken) {
            $("#node-config-input-apiToken").val(this.token);
        }
        if (this.secret && !credentials.has_apiSecret) {
            $("#node-config-input-apiSecret").val(this.secret);
        }

        // Connections saved by older versions have no authentication type
        let authtype = this.authtype;
        if (!authtype) {
            authtype = (this.username || credentials.user) ? "password" : "token_hmac_header";
        }
        $("#node-config-input-authtype").val(authtype);

        $("#node-config-input-authtype").typedInput({
            types: [
                {
                    value: "authtype",
                    options: [
                        {value: "password", label: "Username/Password"},
                        {value: "token_hmac_header", label: "HMAC Header Token"},
                        {value: "bearer", label: "Bearer Token"}
                    ]
                }
            ]
        });

        $("#node-config-input-authtype").on('change', function(event, type, value) {
            modifyAuthenticationType(value);
        });

        modifyAuthenticationType($("#node-config-input-authtype").typedInput('value'));
    }

    function onEditSave() {
        // Legacy plain-text values now live in the encrypted credentials
        this.username = null;
        this.password = null;
        this.token = null;
        this.secret = null;
    }

    function modifyAuthenticationType(value) {
        let passwordMethod = "hide";
        let tokenMethod = "hide";
        let secretMethod = "hide";

        if (value == "password") {
            passwordMethod = "show"
        } else if (value == "token_hmac_header") {
            tokenMethod = "show";
            secretMethod = "show";
        } else if (value == "bearer") {
            tokenMethod = "show";
        }

        $(".node-config-user-password-group")[passwordMethod]();
        $(".node-config-token-group")[tokenMethod]();
        $(".node-config-secret-group")[secretMethod]();
    }
</script>

<script type="text/html" data-template-name="servicely-connection">

    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input id="node-config-input-name" placeholder="Name">
    </div>

    <hr />

    <div class="form-row">
        <label for="node-config-input-baseUrl"><i class="fa fa-globe"></i> Base URL</label>
        <input type="text" id="node-config-input-baseUrl" placeholder="https://instance.servicely.ai/">
    </div>

    <div class="form-row">
        <label for="node-config-input-queue"><i class="fa fa-list"></i> Queue</label>
        <input type="text" id="node-config-input-queue" placeholder="Queue">
    </div>

    <div class="form-row">
        <label for="node-config-input-authtype"><i class="fa fa-lock"></i> Authentication</label>
        <input type="text" id="node-config-input-authtype" placeholder="Authentication type">
    </div>

    <div class="form-row node-config-user-password-group">
        <label for="node-config-input-user"><i class="fa fa-user"></i> Username</label>
        <input type="text" id="node-config-input-user" placeholder="Username">
    </div>

    <div class="form-row node-config-user-password-group">
        <label for="node-config-input-pass"><i class="fa fa-key"></i> Password</label>
        <input type="password" id="node-config-input-pass" placeholder="Password">
    </div>

    <div class="form-row node-config-token-group">
        <label for="node-config-input-apiToken"><i class="fa fa-id-card"></i> Token</label>
        <input type="password" id="node-config-input-apiToken" placeholder="Token">
    </div>

    <div class="form-row node-config-secret-group">
        <label for="node-config-input-apiSecret"><i class="fa fa-key"></i> Token secret</label>
        <input type="password" id="node-config-input-apiSecret" placeholder="Token secret">
    </div>
</script>

<script type="text/html" data-help-name="servicely-connection">
    <p>Connection details for a Servicely instance, shared by the other Servicely nodes.</p>

    <h3>Properties</h3>
    <dl class="message-properties">
        <dt>Base URL <span class="property-type">string</span></dt>
        <dd>The instance URL, e.g. <code>https://instance.servicely.ai/</code>.</dd>
        <dt>Queue <span class="property-type">string</span></dt>
        <dd>The asynchronous queue the <b>Queue</b> node claims actions from.</dd>
        <dt>Authentication</dt>
        <dd>
            <ul>
                <li><b>Username/Password</b>: HTTP Basic authentication.</li>
                <li><b>HMAC Header Token</b>: signs each request with a System API Token and its secret.</li>
                <li><b>Bearer Token</b>: sends a System API Token as <code>Authorization: Bearer</code>.</li>
            </ul>
        </dd>
    </dl>

    <h3>Details</h3>
    <p>Passwords, tokens and secrets are stored as Node-RED credentials, so they are encrypted and are
        not included when flows are exported. Connections created with older versions of this module stored
        them in the flow itself; they keep working, and are moved into credentials the next time the
        connection is opened and saved.</p>
    <p>If the token has <i>Allowed Scopes</i> configured on the instance, make sure they include the endpoints
        used by your nodes: the asynchronous queue, the import manager, the REST API and/or inbound webhooks.</p>
</script>

<script type="text/html" data-template-name="servicely-connection-injector">
    <div class="form-row">
        <label for="node-input-connection"><i class="fa fa-globe"></i> Connection</label>
        <input type="text" id="node-input-connection" placeholder="Servicely connection:">
    </div>

    <hr />

    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
</script>

<script type="text/html" data-help-name="servicely-connection-injector">
    <p>Adds a Servicely connection to the message, so later Servicely nodes in the flow use it.</p>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>_connectionNode <span class="property-type">string</span></dt>
        <dd>The ID of the selected connection.</dd>
    </dl>

    <h3>Details</h3>
    <p>The <b>Import</b>, <b>Transform</b>, <b>Success</b>, <b>Failure</b> and <b>Progress</b> nodes use the
        connection in <code>msg._connectionNode</code> when they don't have one configured themselves. It is not
        needed after a <b>Queue</b> node, which sets it already.</p>
</script>
