<script type="text/javascript">
    /**
     * Registers a node that calls the Servicely REST API (or an Inbound Webhook).
     */
    RED.nodes.registerType('servicely-rest', {
        category: 'servicely-rest',
        color: '#f3e074',
        defaults: {
            name: {value: ""},
            connection: {value: "", type: "servicely-connection", required: false},
            method: {value: "GET", required: true},
            uri: {value: "/v1/", required: true},
            input_property: { value: "payload", required: false },
            output_property: { value: "payload", required: false },
            output_mode: { value: "auto" }
        },
        inputs: 1,
        outputs: 1,
        paletteLabel: 'REST',
        icon: "servicely-image-nodered.png",
        label: function () {
            return this.name || ((this.method || "GET").toUpperCase() + " " + (this.uri || "")).trim() || "REST";
        },
        oneditprepare: function () {
            // Older versions defaulted to a lowercase method that matched none of the options
            $("#node-input-method").val((this.method || "GET").toUpperCase());
        }
    });

    /**
     * Registers a node that executes an ImportManager transform.
     */
    RED.nodes.registerType('servicely-transform', {
        category: 'servicely-rest',
        color: '#62f518',
        defaults: {
            name: {value: null},
            connection: {value: "", type: "servicely-connection", required: false},
            transform_name: {value: null, required: false},
            import_table: {value: null, required: false},
            output_property: { value: "transform_result", required: false }
        },
        inputs: 1,
        outputs: 1,
        paletteLabel: 'Transform',
        icon: "servicely-image-nodered.png",
        label: function () {
            return this.name || this.transform_name || "Transform";
        }
    });

    /**
     * Registers a node that executes an ImportManager import.
     */
    RED.nodes.registerType('servicely-import', {
        category: 'servicely-rest',
        color: '#62f518',
        defaults: {
            name: { value: null },
            connection: {value: "", type: "servicely-connection", required: false},
            import_name: {value: null, required: false},
            import_table: {value: null, required: false},
            input_property: { value: "payload", required: false },
            output_property: { value: "import_result", required: false }
        },
        inputs: 1,
        outputs: 1,
        paletteLabel: 'Import',
        icon: "servicely-image-nodered.png",
        label: function () {
            return this.name || this.import_table || "Import";
        }
    });
</script>

<script type="text/html" data-template-name="servicely-rest">

    <div class="form-row">
        <label for="node-input-connection"><i class="fa fa-globe"></i> Connection</label>
        <input type="text" id="node-input-connection" placeholder="Servicely connection:">
    </div>

    <div class="form-row">
        <label for="node-input-method"><i class="fa fa-tasks"></i> Method</label>
        <select id="node-input-method">
            <option value="GET">GET</option>
            <option value="POST">POST</option>
            <option value="PATCH">PATCH</option>
            <option value="PUT">PUT</option>
            <option value="DELETE">DELETE</option>
        </select>

    <div class="form-row">

    <div class="form-row">

    <div class="form-row">
        <label for="node-input-output_mode"><i class="fa fa-filter"></i> Output</label>

    <div class="form-row">

<script type="text/html" data-help-name="servicely-rest">
    <p>Calls the Servicely REST API, or an Inbound Webhook.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>The request body for POST, PUT and PATCH, read from the <i>Input prop.</i> property.</dd>
        <dt class="optional">_connectionNode <span class="property-type">string</span></dt>
        <dd>The connection to use when none is configured on the node.</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>The response, written to the <i>Output prop.</i> property.</dd>
        <dt>statusCode <span class="property-type">number</span></dt>
        <dd>The HTTP status of the response.</dd>
    </dl>

    <h3>Details</h3>
    <p>The URI is relative to the connection's base URL, e.g. <code>/v1/Incident</code> or
        <code>/_webhook/v2/my_webhook</code>. It can include message properties, which are URL-encoded:
        <code>/v1/Incident/${msg.payload.id}</code>.</p>
    <p><b>Output</b> controls what is written to the output property:</p>
    <ul>
        <li><b>Automatic</b>: the response's <code>data</code> field when it has one (REST API), otherwise the
            whole body (Inbound Webhooks).</li>
        <li><b>"data" field</b>: always the <code>data</code> field.</li>
        <li><b>Whole response body</b>: the body as returned.</li>
    </ul>
    <p>Errors, including HTTP error responses, can be handled with a <b>Catch</b> node. The message has
        <code>msg.error</code>, <code>msg.statusCode</code> and the error text in <code>msg.payload</code>.</p>
</script>

<script type="text/html" data-help-name="servicely-import">
    <p>Loads data into a Servicely Import Table. The data can then be processed with the <b>Transform</b> node.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">array | object</span></dt>
        <dd>The rows to import, read from the <i>Data prop.</i> property.</dd>
        <dt class="optional">import_name <span class="property-type">string</span></dt>
        <dd>The import source, when not configured on the node.</dd>
        <dt class="optional">import_table <span class="property-type">string</span></dt>
        <dd>The import table, when not configured on the node.</dd>
        <dt class="optional">import_metadata <span class="property-type">object</span></dt>
        <dd>Extra metadata sent with the import, in addition to <code>lastImportTimestamp</code>.</dd>
        <dt class="optional">import_enabled <span class="property-type">boolean</span></dt>
        <dd>Set to <code>false</code> to pass the message through without importing.</dd>
        <dt class="optional">_connectionNode <span class="property-type">string</span></dt>
        <dd>The connection to use when none is configured on the node.</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>import_result <span class="property-type">object</span></dt>
        <dd>The import result, written to the <i>Result prop.</i> property. <code>msg.payload</code> is left unchanged.</dd>
    </dl>
</script>

<script type="text/html" data-help-name="servicely-transform">
    <p>Runs a Servicely import transform, moving rows from an Import Table into their destination tables.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt class="optional">transform_name <span class="property-type">string</span></dt>
        <dd>The transform to run, when not configured on the node.</dd>
        <dt class="optional">import_table <span class="property-type">string</span></dt>
        <dd>The import table, when not configured on the node.</dd>
        <dt class="optional">transform_enabled <span class="property-type">boolean</span></dt>
        <dd>Set to <code>false</code> to pass the message through without transforming.</dd>
        <dt class="optional">_connectionNode <span class="property-type">string</span></dt>
        <dd>The connection to use when none is configured on the node.</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>transform_result <span class="property-type">object</span></dt>
        <dd>The transform result, written to the <i>Result prop.</i> property. <code>msg.payload</code> is left unchanged.</dd>
    </dl>
</script>
